<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API কনসোল</title>
<style>
body{font-family:system-ui,"Noto Sans Bengali",sans-serif;background:#0a0b1e;color:#eef0ff;margin:0;padding:16px;max-width:560px;margin:0 auto}
select,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #3a3f80;background:#0a0c2e;color:#eef0ff;font-size:15px}
textarea{height:90px;font-family:ui-monospace,monospace}
button{background:#2de2e6;color:#06112a;font-weight:700;border:0}
pre{background:#12143a;border:1px solid #2b2f6a;border-radius:12px;padding:12px;white-space:pre-wrap;word-break:break-word;font-size:13px}
.m{color:#9aa0cf;font-size:14px}
</style>
</head>
<body>
<h2>API কনসোল (পরীক্ষার জন্য)</h2>
<p class="m">আগে /test.html দিয়ে লগইন করুন, তারপর এখানে এসে একটা কাজ বেছে "পাঠান" চাপুন।</p>
<select id="ep"></select>
<textarea id="body"></textarea>
<button id="go">পাঠান</button>
<pre id="out">উত্তর এখানে আসবে</pre>
<script>
var L = [
 ['GET /api/state', ''],
 ['POST /api/task/start', '{"id":"ad0"}'],
 ['POST /api/task/claim', '{"id":"ad0"}'],
 ['POST /api/bonus/claim', '{"key":"daily"}'],
 ['POST /api/bonus/claim', '{"key":"login"}'],
 ['POST /api/spin', ''],
 ['POST /api/package/buy', '{"index":1}'],
 ['GET /api/ranking?range=week', ''],
 ['GET /api/live', ''],
 ['GET /api/requests', ''],
 ['POST /api/smm/order', '{"pf":"YouTube","sv":"Views","link":"https://youtube.com/watch?v=x","qty":1000}'],
 ['GET /api/smm/orders', ''],
 ['POST /api/support', '{"message":"পরীক্ষা"}']
];
var ep = document.getElementById('ep'), body = document.getElementById('body');
L.forEach(function (x, i) { var o = document.createElement('option'); o.value = i; o.textContent = x[0]; ep.appendChild(o); });
function fill() { body.value = L[ep.value][1]; }
ep.onchange = fill; fill();
document.getElementById('go').onclick = async function () {
  var p = L[ep.value][0].split(' ');
  var out = document.getElementById('out');
  out.textContent = '...';
  try {
    var r = await fetch(p[1], { method: p[0], headers: { 'Content-Type': 'application/json' }, body: p[0] === 'POST' ? (body.value || '{}') : undefined, credentials: 'same-origin' });
    var t = await r.text();
    try { t = JSON.stringify(JSON.parse(t), null, 2); } catch (e) {}
    out.textContent = 'HTTP ' + r.status + '\n' + t;
  } catch (e) { out.textContent = 'সমস্যা: ' + e.message; }
};
</script>
</body>
</html>
